<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chaos Draft</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --line:#242c38; --ink:#e6edf3;
    --muted:#7d8798; --accent:#e8542a; --ok:#3fb950; --bad:#f85149;
    --mono:ui-monospace,"Cascadia Code",Consolas,"SF Mono",monospace;
    --sans:"Segoe UI",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;overflow:hidden;
    -webkit-text-size-adjust:100%;
  }

  /* ---------- join ---------- */
  #join{
    position:fixed;inset:0;background:var(--bg);z-index:20;
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  #join .card{width:100%;max-width:400px;text-align:center}
  #join h1{font-size:34px;letter-spacing:-.5px;margin-bottom:6px}
  #join h1 span{color:var(--accent)}
  #join p{color:var(--muted);font-size:14px;line-height:1.6;margin-bottom:24px}
  #join input{
    width:100%;padding:14px 16px;font-size:16px;font-family:var(--sans);
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    color:var(--ink);outline:none;text-align:center;
  }
  #join input:focus{border-color:var(--accent)}
  #join button{
    width:100%;margin-top:12px;padding:14px;font-size:15px;font-weight:600;
    background:var(--accent);color:#fff;border:0;border-radius:10px;cursor:pointer;
    font-family:var(--sans);
  }
  #join button:hover{filter:brightness(1.1)}

  /* ---------- chrome ---------- */
  header{
    display:flex;align-items:center;gap:14px;padding:10px 16px;
    border-bottom:1px solid var(--line);background:var(--panel);flex-shrink:0;
  }
  .brand{font-weight:700;font-size:15px;white-space:nowrap}
  .brand span{color:var(--accent)}
  .stat{font-size:12px;color:var(--muted);white-space:nowrap}
  .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
  .spacer{flex:1}
  .hostbtn{
    background:transparent;border:1px solid var(--line);color:var(--muted);
    padding:5px 10px;border-radius:6px;font-size:12px;cursor:pointer;font-family:var(--sans);
  }
  .hostbtn:hover{color:var(--ink);border-color:var(--muted)}

  main{flex:1;display:flex;min-height:0}

  /* ---------- story ---------- */
  #story{
    flex:1;overflow-y:auto;padding:28px 32px 20px;
    font-size:21px;line-height:1.85;word-spacing:.5px;
  }
  #story .w{
    display:inline;border-radius:3px;padding:1px 1px;
    transition:background .5s ease;
  }
  #story .w.new{background:rgba(232,84,42,.28)}
  #story .w.gone{text-decoration:line-through;opacity:.35;color:var(--muted)}
  #empty{color:var(--muted);font-size:15px;font-style:italic;line-height:1.7}

  /* ---------- people ---------- */
  aside{
    width:190px;border-left:1px solid var(--line);background:var(--panel);
    padding:16px;overflow-y:auto;flex-shrink:0;
  }
  aside h2{
    font-size:11px;text-transform:uppercase;letter-spacing:.09em;
    color:var(--muted);margin-bottom:10px;font-weight:600;
  }
  .person{
    display:flex;align-items:center;gap:8px;font-size:13px;
    padding:3px 0;color:var(--ink);
  }
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

  /* ---------- input ---------- */
  footer{
    border-top:1px solid var(--line);background:var(--panel);
    padding:12px 16px;flex-shrink:0;
  }
  .row{display:flex;gap:10px;max-width:760px;margin:0 auto}
  #word{
    flex:1;padding:13px 16px;font-size:16px;font-family:var(--mono);
    background:var(--bg);border:1px solid var(--line);border-radius:9px;
    color:var(--ink);outline:none;
  }
  #word:focus{border-color:var(--accent)}
  #word.shake{animation:shake .4s;border-color:var(--bad)}
  @keyframes shake{
    0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)}
    40%{transform:translateX(7px)} 60%{transform:translateX(-4px)}
    80%{transform:translateX(4px)}
  }
  #send{
    padding:13px 22px;font-size:15px;font-weight:600;background:var(--accent);
    color:#fff;border:0;border-radius:9px;cursor:pointer;font-family:var(--sans);
  }
  #send:hover{filter:brightness(1.1)}
  #msg{
    max-width:760px;margin:8px auto 0;font-size:13px;min-height:18px;
    text-align:center;color:var(--muted);
  }
  #msg.bad{color:var(--bad)} #msg.ok{color:var(--ok)}

  @media(max-width:720px){
    aside{display:none}
    #story{padding:18px 18px 12px;font-size:19px}
    .stat.hide-sm{display:none}
  }
</style>
</head>
<body>

<div id="join">
  <div class="card">
    <h1>Chaos <span>Draft</span></h1>
    <p>
      One story. One word each, as fast as you like.<br>
      A bot reads every word before it lands.
    </p>
    <input id="name" placeholder="your name" maxlength="24" autocomplete="off">
    <button id="go">Start writing</button>
  </div>
</div>

<header>
  <div class="brand">Chaos <span>Draft</span></div>
  <div class="stat"><b id="n-words">0</b> words</div>
  <div class="stat hide-sm">bot ate <b id="n-blocked">0</b></div>
  <div class="stat hide-sm" id="wrap-retracted" style="display:none">
    pulled <b id="n-retracted">0</b>
  </div>
  <div class="spacer"></div>
  <div class="stat hide-sm" id="speed"></div>
  <button class="hostbtn" id="btn-copy">Copy story</button>
  <button class="hostbtn" id="btn-undo" style="display:none">Undo</button>
  <button class="hostbtn" id="btn-reset" style="display:none">Reset</button>
</header>

<main>
  <div id="story"><div id="empty">Nothing yet. Someone type the first word.</div></div>
  <aside>
    <h2>Here now</h2>
    <div id="people"></div>
  </aside>
</main>

<footer>
  <div class="row">
    <input id="word" placeholder="one word, then Enter" maxlength="40"
           autocomplete="off" autocapitalize="off" spellcheck="false" disabled>
    <button id="send" disabled>Add</button>
  </div>
  <div id="msg"></div>
</footer>

<script>
const $ = id => document.getElementById(id);
const key = new URLSearchParams(location.search).get("key") || "";

let ws, me = "", isHost = false, msgTimer;

// Stable colour per name, so each person's words are recognisable.
function hue(name){
  let h = 0;
  for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return h;
}
const colour = name => `hsl(${hue(name)} 70% 68%)`;

function flash(text, cls){
  const el = $("msg");
  el.textContent = text;
  el.className = cls || "";
  clearTimeout(msgTimer);
  if (text) msgTimer = setTimeout(() => { el.textContent = ""; el.className = ""; }, 3200);
}

function renderWords(words){
  const story = $("story");
  story.innerHTML = "";
  if (!words.length){
    story.innerHTML = '<div id="empty">Nothing yet. Someone type the first word.</div>';
    return;
  }
  for (const w of words) story.appendChild(makeWord(w));
  story.scrollTop = story.scrollHeight;
}

function makeWord(w){
  const span = document.createElement("span");
  span.className = "w" + (w.text ? "" : " gone");
  span.id = "w" + w.i;
  span.textContent = (w.text || "█") + " ";
  span.style.color = colour(w.author);
  span.title = w.author;
  return span;
}

function renderPeople(users){
  $("people").innerHTML = users.map(u => `
    <div class="person">
      <span class="dot" style="background:${colour(u)}"></span>
      <span>${u === me ? u + " (you)" : u}</span>
    </div>`).join("");
}

function connect(){
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");

  ws.onopen = () => ws.send(JSON.stringify({type:"join", name:me, key}));

  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);

    if (m.type === "state"){
      renderWords(m.words);
      renderPeople(m.users);
      $("n-words").textContent = m.words.filter(w => w.text).length;
      $("n-blocked").textContent = m.blocked;
      $("n-retracted").textContent = m.retracted;
      if (m.retracted) $("wrap-retracted").style.display = "";
      if (m.isHost !== undefined && m.isHost){
        isHost = true;
        $("btn-undo").style.display = "";
        $("btn-reset").style.display = "";
      }
      $("word").disabled = false; $("send").disabled = false; $("word").focus();
    }

    else if (m.type === "word"){
      const story = $("story");
      if ($("empty")) story.innerHTML = "";
      const el = makeWord(m.word);
      el.classList.add("new");
      story.appendChild(el);
      setTimeout(() => el.classList.remove("new"), 600);
      story.scrollTop = story.scrollHeight;
      $("n-words").textContent = +$("n-words").textContent + 1;
      if (m.word.author === me){
        // Clear any lingering rejection notice now that one has gone through.
        flash("");
        if (m.micros !== undefined) $("speed").textContent = `checked in ${m.micros}µs`;
      }
    }

    else if (m.type === "rejected"){
      const w = $("word");
      w.classList.add("shake");
      setTimeout(() => w.classList.remove("shake"), 400);
      flash(m.reason, "bad");
      w.select();
    }

    else if (m.type === "blocked_count"){
      $("n-blocked").textContent = m.blocked;
    }

    else if (m.type === "retracted"){
      const el = $("w" + m.i);
      if (el){ el.classList.add("gone"); el.textContent = "█ "; }
      $("n-retracted").textContent = m.retracted;
      $("wrap-retracted").style.display = "";
      $("n-words").textContent = Math.max(0, +$("n-words").textContent - 1);
    }

    else if (m.type === "presence") renderPeople(m.users);
    else if (m.type === "error") flash(m.reason, "bad");
  };

  // The laptop's wifi will drop at least once during a workshop. Just reconnect.
  ws.onclose = () => {
    $("word").disabled = true; $("send").disabled = true;
    flash("Reconnecting…", "bad");
    setTimeout(connect, 1200);
  };
}

function submit(){
  const input = $("word");
  const text = input.value.trim();
  if (!text || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({type:"word", text}));
  input.value = "";
}

$("go").onclick = () => {
  const name = $("name").value.trim();
  if (!name) return $("name").focus();
  me = name;
  $("join").style.display = "none";
  connect();
};
$("name").onkeydown = e => { if (e.key === "Enter") $("go").click(); };
$("name").focus();

$("send").onclick = submit;
$("word").onkeydown = e => { if (e.key === "Enter") submit(); };

$("btn-undo").onclick  = () => ws.send(JSON.stringify({type:"undo", key}));
$("btn-reset").onclick = () => {
  if (confirm("Clear the whole story for everyone?"))
    ws.send(JSON.stringify({type:"reset", key}));
};
$("btn-copy").onclick = async () => {
  const text = await (await fetch("/story.txt")).text();
  try { await navigator.clipboard.writeText(text); flash("Story copied.", "ok"); }
  catch { window.open("/story.txt", "_blank"); }
};
</script>
</body>
</html>
