# One-click deploy on Render's free tier.
#
#   render.com -> New -> Blueprint -> pick this repo
#
# Free instances sleep after about 15 minutes of no traffic and take roughly a
# minute to wake. Open the page a couple of minutes before the session starts and
# it will be warm by the time anyone scans the QR.

services:
  - type: web
    name: chaos-draft
    runtime: python
    plan: free
    rootDir: chaos-draft
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py --host 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
